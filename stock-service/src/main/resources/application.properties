spring.application.name=stock-service

server.port=4006

management.server.port=9090
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.discovery.enabled=false
management.tracing.sampling.probability=1.0
management.opentelemetry.resource-attributes[service.name]=stock-service
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://tempo:4318/v1/traces}
management.otlp.metrics.export.enabled=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate

spring.sql.init.mode=never

spring.jpa.properties.hibernate.type.json_format_mapper=jackson3

# outbox relay ms
outbox.relay.enabled=true
outbox.relay.fixed-delay-ms=2000

# topic
kafka.topic.product-events=product.events
kafka.topic.stock-commands=stock.commands
kafka.topic.stock-events=stock.events
kafka.topic.stock-commands-dlt=stock.commands.DLT
kafka.topic.product-events-dlt=product.events.DLT


# kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# kafka consumer
spring.kafka.consumer.group-id=stock-service
spring.kafka.listener.observation-enabled=true
spring.kafka.consumer.properties.allow.auto.create.topics=false

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=dev.erkut.stockservice.message.MessageEnvelope

#producer
spring.kafka.producer.client-id=stock-service-producer
spring.kafka.template.observation-enabled=true
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false

