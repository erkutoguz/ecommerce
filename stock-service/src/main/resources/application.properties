spring.application.name=stock-service

server.port=4006

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate

spring.sql.init.mode=never

spring.jpa.properties.hibernate.type.json_format_mapper=jackson3

# outbox relay ms
outbox.relay.enabled=true
outbox.relay.fixed-delay-ms=2000

# topic
kafka.topic.product-events=product.events
kafka.topic.stock-commands=stock.commands
kafka.topic.stock-events=stock.events
kafka.topic.stock-commands-dlt=stock.commands.DLT
kafka.topic.product-events-dlt=product.events.DLT


# kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# kafka consumer
spring.kafka.consumer.group-id=stock-service

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=dev.erkut.stockservice.message.MessageEnvelope

#producer
spring.kafka.producer.client-id=stock-service-producer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false



