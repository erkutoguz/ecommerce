global:
  scrape_interval: 15s

scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - order-service:9090
  - job_name: order-workflow-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - order-workflow-service:9090
  - job_name: stock-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - stock-service:9090
