services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: >
        INTERNAL://:29092,
        EXTERNAL://:9092,
        CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka:29092,
        EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - app-network
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "4005:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - app-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - 4002:4002
    environment:
      ORDER_SERVICE_URL: http://order-service:4000
      CUSTOMER_SERVICE_URL: http://customer-service:4001
      PRODUCT_SERVICE_URL: http://product-service:4003
      PAYMENT_SERVICE_URL: http://payment-service:4007
    depends_on:
      - customer-service
      - order-service
      - product-service
      - payment-service
    networks:
      - app-network

  customer-service:
    build:
      context: ./customer-service
    ports:
      - "4001:4001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://customer-db:5432/customer
      SPRING_DATASOURCE_USERNAME: customer
      SPRING_DATASOURCE_PASSWORD: customer-pass
    depends_on:
      customer-db:
        condition: service_healthy
    networks:
      - app-network
      - customer-db-network

  customer-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: customer
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: customer-pass
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U customer -d customer" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - customer-db-network

  order-service:
    build:
      context: ./order-service
    ports:
      - "4000:4000"
    environment:
      CUSTOMER_SERVICE_URL: http://customer-service:4001/customers
      PRODUCT_SERVICE_URL: http://product-service:4003/products
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/order
      SPRING_DATASOURCE_USERNAME: order
      SPRING_DATASOURCE_PASSWORD: order-pass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      order-db:
        condition: service_healthy
      customer-service:
        condition: service_started
      product-service:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - app-network
      - order-db-network

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order-pass
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U order -d order" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - order-db-network

  product-service:
    build:
      context: ./product-service
    ports:
      - "4003:4003"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/product
      SPRING_DATASOURCE_USERNAME: product
      SPRING_DATASOURCE_PASSWORD: product-pass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      product-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - app-network
      - product-db-network

  product-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: product
      POSTGRES_USER: product
      POSTGRES_PASSWORD: product-pass
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U product -d product" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - product-db-network

  order-workflow-service:
    build:
      context: ./order-workflow-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-workflow-db:5432/order-workflow
      SPRING_DATASOURCE_USERNAME: order-workflow
      SPRING_DATASOURCE_PASSWORD: order-workflow-pass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      order-workflow-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - app-network
      - order-workflow-db-network

  order-workflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order-workflow
      POSTGRES_USER: order-workflow
      POSTGRES_PASSWORD: order-workflow-pass
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U order-workflow -d order-workflow" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - order-workflow-db-network

  stock-service:
    build:
      context: ./stock-service
    ports:
      - "4006:4006"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stock-db:5432/stock
      SPRING_DATASOURCE_USERNAME: stock
      SPRING_DATASOURCE_PASSWORD: stock-pass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      stock-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - app-network
      - stock-db-network

  stock-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock-pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - stock-db-network

  payment-service:
    build:
      context: ./payment-service
    ports:
      - "4007:4007"
    env_file:
      - ./payment-service/.env.local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/payment
      SPRING_DATASOURCE_USERNAME: payment
      SPRING_DATASOURCE_PASSWORD: payment-pass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - app-network
      - payment-db-network

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment-pass
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U payment -d payment" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - payment-db-network


networks:
  app-network:

  customer-db-network:
    internal: true

  order-db-network:
    internal: true

  product-db-network:
    internal: true

  order-workflow-db-network:
    internal: true

  stock-db-network:
    internal: true

  payment-db-network:
    internal: true
