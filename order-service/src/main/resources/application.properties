spring.application.name=order-service

server.port=4000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:dev/db/migration

spring.jpa.hibernate.ddl-auto=validate

spring.sql.init.mode=never

restclient.customer.url=${CUSTOMER_SERVICE_URL:http://localhost:4001/customers}
restclient.product.url=${PRODUCT_SERVICE_URL:http://localhost:4003/products}

spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=3s

# to be sure about json format mapper version
spring.jpa.properties.hibernate.type.json_format_mapper=jackson3
