outbox.relay.enabled=false

spring.jpa.properties.hibernate.type.json_format_mapper=jackson3

kafka.topic.order-events=order.events
kafka.topic.stock-commands=stock.commands
kafka.topic.stock-events=stock.events
kafka.topic.payment-commands=payment.commands
kafka.topic.payment-events=payment.events
kafka.topic.payment-events-dlt=payment.events.DLT
kafka.topic.order-commands=order.commands
kafka.topic.order-events-dlt=order.events.DLT
kafka.topic.stock-events-dlt=stock.events.DLT
spring.kafka.consumer.group-id=order-workflow-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=dev.erkut.orderworkflowservice.message.MessageEnvelope
