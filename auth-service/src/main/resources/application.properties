spring.application.name=auth-service

server.port=4008

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate

spring.sql.init.mode=never

auth.jwt.issuer=ecommerce-auth
auth.jwt.audience=ecommerce-api
auth.jwt.access-token-ttl=15m
auth.jwt.key-id=ecommerce-auth-key-1

auth.jwt.public-key=file:${JWT_PUBLIC_KEY_PATH}
auth.jwt.private-key=file:${JWT_PRIVATE_KEY_PATH}

spring.jpa.properties.hibernate.type.json_format_mapper=jackson3

# outbox relay ms
outbox.relay.enabled=true
outbox.relay.fixed-delay-ms=2000

# kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# kafka producer
kafka.topic.customer-commands=customer.commands

spring.kafka.producer.client-id=auth-service-producer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false