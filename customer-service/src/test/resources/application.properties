spring.application.name=customer-service
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:dev/db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.type.json_format_mapper=jackson3

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=customer-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=dev.erkut.customerservice.message.MessageEnvelope
spring.kafka.producer.client-id=customer-service-test-producer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

kafka.topic.customer-commands=customer.commands
kafka.topic.customer-commands-dlt=customer.commands.DLT

spring.kafka.admin.auto-create=false
spring.kafka.listener.auto-startup=false
