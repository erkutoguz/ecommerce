name: ecommerce CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  order-service:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: order-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: order-service/pom.xml

      - name: Run tests
        run: ./mvnw test
